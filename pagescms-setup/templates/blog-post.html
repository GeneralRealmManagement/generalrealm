<!DOCTYPE html>
<html lang="en">
<head>


    <link rel="preconnect" href="https://ajax.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/style.css">

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{seoTitle}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{seoDesc}}">
    <link rel="canonical" href="{{canonical}}">

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{seoTitle}}">
    <meta property="og:description" content="{{seoDesc}}">
    <meta property="og:image" content="{{image}}">
    <meta property="og:url" content="{{canonical}}">
</head>

<body class="page-loading post-template">


<main id="page" class="Articlepage">
	<header class="header dark">
    <div class="header__inner">
      <div class="logoContainer">
          <a href="/" class="header__logo header__logo-small" title="EighthBrain">EighthBrain</a>
      </div>


        <nav class="nav">
        <ul class="menu">
    <!-- Loop through the navigation items -->
    <li class="nav-home "><a href="/">Home</a></li>
    <li class="nav-content"><a href="/services">Services</a></li>
    <li class="nav-content"><a href="/content">Content</a></li>
    <li class="nav-talent"><a href="/talent">Talent</a></li>
    <li class="nav-content"><a href="/production">Production</a></li>
    <li class="nav-about"><a href="/about">About</a></li>
    <li class="nav-blog nav-current"><a href="/blog/">Blog</a></li>
    <li class="nav-contact"><a href="/contact">Contact</a></li>
    <!-- End the loop -->
</ul>

</nav>
        <button class="header__toggle link" title="Open Navigation">
          <span class="line"></span>
          <span class="line alt"></span>
          <span class="line"></span>
        </button>
    </div>
  </header>
</main>

<div class="HeaderDivider"></div>


  <section class="ArticleWrapper">
      <div class="postImage" style="background-image:url({{image}})"></div>
      <div class="post-container">
           <div class="PostTitle">
            <h1>{{title}}</h1>
            <p class="postMeta">By: {{author}} &middot; {{date}}</p>
          </div>

          <div class="PostContent">
{{content}}
          </div>
      </div>
  </section>



<!--Footer Start  -->

<footer>
  <div class="container">
     <div class="footer-logo">EighthBrain</div>

     <div class="footer-social-">

        <ul class="footersocial">
            <li><a href="#" target="_blank" rel="noopener"><i class="fa fa-facebook" aria-hidden="true"></i></a></li>
            <li><a href="#" target="_blank" rel="noopener"><i class="fa fa-twitter" aria-hidden="true"></i></a></li>
            <li><a href="#" target="_blank" rel="noopener"><i class="fa fa-instagram" aria-hidden="true"></i></a></li>
            <li><a href="#" target="_blank" rel="noopener"><i class="fa fa-linkedin" aria-hidden="true"></i></a></li>
       </ul>
     </div>




     <div class="footer-links">
       <ul>
         <li><a href="/">Home</a></li>
         <li><a href="/about">About</a></li>
         <li><a href="/services">Services</a></li>
         <li><a href="/production">Production</a></li>
         <li><a href="/talent">Talent</a></li>
         <li><a href="/content">Content</a></li>
         <li><a href="/blog/">Blog</a></li>
         <li><a href="/contact">Contact</a></li>
       </ul>

     </div>


    <div class="footer-contact-info">

       <p>&copy;2024 EighthBrain | All Rights Reserved.</p>

    </div>

  </div>

</footer>


<!--Footer END  -->


<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script>
var jq9=jQuery.noConflict();
jq9(document).ready(function(){
  jq9(".header__toggle").click(function(){
      jq9(this).toggleClass("active");
      jq9(".nav").toggleClass("viewable");
  });
});

</script>

</body>
</html>
